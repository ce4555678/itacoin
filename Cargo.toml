[workspace]
members = [
    "crates/itacoin-primitives",
    "crates/itacoin-crypto",
    "crates/itacoin-wallet",
    "crates/itacoin-codec",
    "crates/itacoin-transaction",
    "crates/itacoin-blockchain",
    "crates/itacoin-consensus",
    "crates/itacoin-storage",
    "crates/itacoin-mempool",
    "crates/itacoin-network",
    "crates/itacoin-miner",
    "crates/itacoin-rpc",
    "crates/itacoin-node",
    "crates/itacoin-process",
    "crates/itacoin-wallet-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/itacoin/itacoin"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.dependencies]
argon2 = { version = "=0.5.3", default-features = false, features = ["std", "zeroize"] }
base64 = "=0.22.1"
bech32 = { version = "=0.11.0", default-features = false, features = ["alloc"] }
blake3 = "=1.8.2"
clap = { version = "=4.6.1", features = ["derive"] }
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["std", "getrandom"] }
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
ml-dsa = { version = "=0.1.2", default-features = false, features = ["alloc", "getrandom", "zeroize"] }
rand_core = { version = "=0.6.4", features = ["getrandom"] }
ml-kem = { version = "=0.3.4", default-features = false, features = ["zeroize", "getrandom"] }
redb = "=4.4.0"
rustix = { version = "=1.1.4", features = ["fs", "process"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
siphasher = "=1.0.4"
toml = "=1.1.2"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi"] }
tokio = { version = "=1.54.1", features = ["net", "rt-multi-thread", "macros", "time", "sync", "io-util"] }
x25519-dalek = { version = "=3.0.0", default-features = false, features = ["static_secrets", "zeroize"] }
zeroize = { version = "=1.8.2", features = ["derive"] }

# Argon2id and ML-DSA are prohibitively slow without optimization, which would
# make the security-relevant test suite slow enough to be skipped in practice.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.ml-dsa]
opt-level = 3

[profile.release]
overflow-checks = true
lto = "thin"
codegen-units = 1
